{% load wagtailadmin_tags kontturi_admin %}
{% admin_mfa_required as mfa_required %}
<div class="w-hidden lg:w-flex w-gap-5 w-pt-4 w-mb-[3.5rem] w-px-[3.75rem] w-border-l w-border-border-furniture">
  {% avatar user size="large" edit_link=True %}
  <div>
    <h2 class="w-label-1 w-mt-0 w-mb-1">{{ user|user_display_name }}</h2>
    <ul class="w-list-none w-p-0 w-m-0 w-flex w-flex-col w-gap-1">
      <li><a class="w-underline w-underline-offset-[3px]" href="{% url 'wagtailadmin_account' %}">Oma tili</a></li>
      {% if mfa_required %}<li><a class="w-underline w-underline-offset-[3px]" href="{% url 'two_factor:profile' %}">Kirjautumisen asetukset</a></li>{% endif %}
    </ul>
  </div>
</div>

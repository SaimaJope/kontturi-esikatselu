name: Backend checks

on:
  push:
    branches: [main, feat/managed-cms]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install locked runtime
        run: python -m pip install -r backend/requirements.txt
      - name: Check schema and build editor assets
        run: |
          python backend/manage.py check
          python backend/manage.py makemigrations --check --dry-run
          python backend/manage.py collectstatic --noinput --verbosity 0
      - name: Test authorization, publishing and security controls
        run: python backend/manage.py test tests --noinput
      - name: Audit runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --disable-pip --no-deps -r backend/requirements.txt
